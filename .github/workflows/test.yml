name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q src
      - name: Run tests
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Publish test output
        if: steps.pytest.outcome != 'success'
        run: |
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          message=$(python -c "import urllib.parse; print(urllib.parse.quote(open('pytest-output.txt').read()[-6000:]))")
          echo "::error title=pytest output::$message"
      - name: Enforce test result
        if: steps.pytest.outcome != 'success'
        run: exit 1
